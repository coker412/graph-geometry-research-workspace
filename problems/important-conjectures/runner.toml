# Background tmux session.
session_name = "important_conjectures"

# Explicit models keep isolated branches independent of temporary CLI defaults.
# Replace them with models available to your account if needed.
model = "gpt-6-astra"
reasoning_effort = "medium"
runtime_version = 2
research_task_version = 1
phase = "research"

# Per-call timeout in minutes; 0 disables it.
attempt_timeout_minutes = 90
# Total hours per background start; 0 means continuous operation.
max_wall_hours = 24
idle_seconds = 60
max_idle_cycles = 0

# Empty information_mode uses the web_search compatibility switch.
# Explicit modes: offline / connected / mixed-isolated.
information_mode = ""
web_search = false
max_consecutive_runtime_failures = 3

[phase_model]
triage = "gpt-6-astra"
research = "gpt-6-astra"
experiment = "gpt-5.6-sol"
literature = "gpt-5.6-sol"
audit = "gpt-6-astra"
critical-audit = "gpt-6-astra"
stuck-escalation = "gpt-6-astra"

[phase_effort]
triage = "high"
research = "medium"
experiment = "medium"
literature = "medium"
audit = "high"
critical-audit = "xhigh"
stuck-escalation = "high"

# Initial-packet budgets in UTF-8 bytes, not billing tokens.
# Oversized evidence remains available through explicit references.
[context_budget]
packet_target_bytes = 32768
packet_hard_bytes = 65536
max_evidence_slices = 8
max_single_evidence_bytes = 12288
