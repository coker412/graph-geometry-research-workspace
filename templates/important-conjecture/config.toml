title = "{{TITLE}}"

# Set true only after the researcher has completed and checked problem.md.
ready = false
enabled = true

# Search objective: affirmative-proof / counterexample / either.
# An affirmative search assumption is not mathematical evidence.
search_contract = "affirmative-proof"

# Renewed-exploration rounds without a new mechanism before blocked is allowed.
# Zero forbids automatic stagnation blocking.
stagnation_rounds_before_blocked = 0

# Empty inherits the runner setting; offline / connected / mixed-isolated.
information_mode = ""

# Optional existing workspace-relative directory under projects/.
# Empty uses projects/conjecture-<slug>/.
project_path = ""

# Higher runs first; equal priorities use slug order with one step per pass.
priority = 100

# Cumulative executions, not completed mathematical tasks. Zero is unlimited.
max_attempts = 0

# Optional phase override; otherwise inherit runner.toml.
# phase = "research"
# Only critical-audit / stuck-escalation allow xhigh.
